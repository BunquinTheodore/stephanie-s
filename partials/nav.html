<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header" data-header>
  <nav class="nav" aria-label="Main">
    <a class="nav__brand" href="/" aria-label="{{site.name}}, home">{{{brand.navLogo}}}</a>
    <ul class="nav__links" role="list">{{{nav.links}}}</ul>
    <a class="btn btn--sm nav__cta" href="{{site.links.messenger}}" target="_blank" rel="noopener">Reserve</a>
    <button class="nav__toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="nav-drawer" aria-label="Open menu"><span></span><span></span><span></span></button>
  </nav>
</header>
<div class="nav-drawer" id="nav-drawer" inert>
  <nav aria-label="Mobile">
    <ul class="nav-drawer__links" role="list">{{{nav.drawer}}}</ul>
  </nav>
  <div class="nav-drawer__foot">
    <a class="btn" href="{{site.links.messenger}}" target="_blank" rel="noopener">Reserve on Messenger</a>
    <a class="btn btn--ghost" href="{{site.phone.href}}">Call {{site.phone.display}}</a>
    <button type="button" class="motion-toggle" data-motion-toggle aria-pressed="false">Pause motion</button>
    <span>{{site.hours.label}}</span>
  </div>
</div>
<nav class="tabbar" aria-label="Quick" data-tabbar>
  <span class="tabbar__pill" aria-hidden="true"></span>
  <ul class="tabbar__list" role="list">{{{nav.tabbar}}}</ul>
</nav>
